name: Publicar avisos de traslado de IA FUTURE

on:
  workflow_dispatch:
    inputs:
      repair_stalled_deployment:
        description: "Cancelar únicamente el despliegue antiguo identificado como bloqueado"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pages-v3
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar los avisos publicados
        uses: actions/checkout@v4
      - name: Configurar publicación mediante GitHub Actions
        uses: actions/github-script@v8
        with:
          script: |
            const route = '/repos/{owner}/{repo}/pages';
            const params = { owner: context.repo.owner, repo: context.repo.repo };
            const current = await github.request(`GET ${route}`, params);
            if (current.data.build_type !== 'workflow') {
              await github.request(`PUT ${route}`, { ...params, build_type: 'workflow' });
            }
            const configured = await github.request(`GET ${route}`, params);
            if (configured.data.build_type !== 'workflow') {
              throw new Error('Pages no ha confirmado la publicación mediante Actions.');
            }
            core.info('Origen de Pages confirmado: GitHub Actions.');
      - name: Liberar el despliegue antiguo bloqueado
        if: inputs.repair_stalled_deployment
        uses: actions/github-script@v8
        with:
          script: |
            // ID exacto indicado por la anotación del despliegue fallido 38596638385.
            const id = '1e146a815c00654d9f12904dc5183ae9bf81c9b5';
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pages_deployment_id: id
              });
              core.info(`Cancelación del despliegue bloqueado ${id} solicitada.`);
            } catch (error) {
              if (error.status === 404 || error.status === 409) {
                core.info(`El despliegue antiguo no está disponible para cancelar (HTTP ${error.status}).`);
              } else {
                throw new Error(`No se pudo cancelar el despliegue antiguo (HTTP ${error.status || 'desconocido'}).`);
              }
            }
      - name: Comprobar avisos antes de publicar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = list(Path('.').rglob('*.html'))
          assert len(pages) == 45, f'Número inesperado de avisos: {len(pages)}'
          for page in pages:
              html = page.read_text()
              assert 'content="noindex,follow"' in html, f'{page}: noindex ausente'
              assert 'rel="canonical" href="https://ssj-ariel.github.io/' in html, f'{page}: destino ausente'
              assert not re.search(r'adsbygoogle|googletagmanager|function gtag', html), f'{page}: servicios activos'
          print(f'{len(pages)} avisos de traslado preparados, sin publicidad ni analítica.')
          PY
      - name: Preparar metadatos de Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto estático completo
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
